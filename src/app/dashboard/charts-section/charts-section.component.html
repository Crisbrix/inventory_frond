<div class="charts-section">
  <!-- Entradas vs Salidas -->
  <div class="chart-card">
    <div class="chart-header">
      <h3 class="chart-title">Entradas vs Salidas</h3>
      <p class="chart-subtitle">Últimos 30 días</p>
    </div>
    <div class="chart-placeholder large">
      <div class="chart-placeholder-text">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.5 18.49L6 15.99L9.5 19.49L16.5 12.49L20 15.99V19.49H16.5L9.5 12.49L6 15.99L3.5 13.49V18.49ZM3.5 3.49V7.99L6 5.49L9.5 8.99L16.5 1.99L20 5.49V1.99H3.5V3.49Z" fill="#6C757D"/>
        </svg>
        <p>Gráfica de Entradas vs Salidas</p>
      </div>
    </div>
  </div>

  <!-- Top 5 Productos -->
  <div class="chart-card">
    <div class="chart-header">
      <h3 class="chart-title">Top 5 Productos Más Movidos</h3>
      <p class="chart-subtitle">Últimos 30 días</p>
    </div>
    <div class="top-products-list">
      <div *ngFor="let product of topProducts; let i = index" class="product-item">
        <div class="product-rank">{{ i + 1 }}</div>
        <div class="product-info">
          <div class="product-name">{{ product.name }}</div>
          <div class="product-bar">
            <div 
              class="product-bar-fill" 
              [style.width.%]="(product.movements / topProducts[0].movements) * 100">
            </div>
          </div>
        </div>
        <div class="product-value">{{ product.movements }}</div>
      </div>
    </div>
  </div>

  <!-- Movimientos por Tipo -->
  <div class="chart-card">
    <div class="chart-header">
      <h3 class="chart-title">Movimientos por Tipo</h3>
      <p class="chart-subtitle">Últimos 30 días</p>
    </div>
    <div class="chart-placeholder">
      <div class="chart-placeholder-text">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 2V22C5.93 21.57 2 17.41 2 12C2 6.59 5.93 2.43 11 2ZM13 2.05C18.05 2.55 22 6.81 22 12C22 17.19 18.05 21.45 13 21.95V2.05Z" fill="#6C757D"/>
        </svg>
        <p>Gráfica de Movimientos por Tipo</p>
      </div>
    </div>
  </div>
</div>
