<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="header-info">
      <div class="header-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 13H11V3H3V13ZM3 21H11V15H3V21ZM13 21H21V11H13V21ZM13 3V9H21V3H13Z" fill="white"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="dashboard-title">Dashboard de Inventario</h1>
        <p class="dashboard-subtitle">Vista general de tu inventario</p>
      </div>
    </div>
  </div>

  <!-- Indicadores rápidos -->
  <div class="indicators-section">
    <div class="cards-grid">
      <app-card 
        *ngFor="let card of indicatorCards" 
        [cardData]="card">
      </app-card>
    </div>
  </div>

  <!-- Acciones rápidas -->
  <app-quick-actions></app-quick-actions>

  <!-- Contenido principal en grid -->
  <div class="main-content-grid">
    <!-- Gráficas -->
    <div class="charts-column">
      <app-charts-section></app-charts-section>
    </div>

    <!-- Alertas -->
    <div class="alerts-column">
      <app-alerts-panel></app-alerts-panel>
    </div>
  </div>

  <!-- Listados rápidos -->
  <app-recent-movements></app-recent-movements>
</div>
