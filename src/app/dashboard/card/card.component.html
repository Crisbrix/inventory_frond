<div class="card">
  <div class="card-badge" *ngIf="cardData.badge">{{ cardData.badge }}</div>
  <div class="card-icon" [ngClass]="getIconClass()">
    <ng-container [ngSwitch]="cardData.iconType">
      <!-- Cart Icon -->
      <svg *ngSwitchCase="'cart'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 18C8.1 18 9 18.9 9 20C9 21.1 8.1 22 7 22C5.9 22 5 21.1 5 20C5 18.9 5.9 18 7 18ZM1 2V4H3L6.6 11.59L5.25 14.04C5.09 14.32 5 14.65 5 15C5 16.1 5.9 17 7 17H19V15H7.42C7.28 15 7.17 14.89 7.17 14.75L7.2 14.63L8.1 13H15.55C16.3 13 16.96 12.59 17.3 11.97L20.88 5.5C20.96 5.34 21 5.17 21 5C21 4.45 20.55 4 20 4H5.21L4.27 2H1ZM17 18C18.1 18 19 18.9 19 20C19 21.1 18.1 22 17 22C15.9 22 15 21.1 15 20C15 18.9 15.9 18 17 18Z" fill="currentColor"/>
      </svg>
      <!-- Money Icon -->
      <svg *ngSwitchCase="'money'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.8 10.9C9.53 10.31 8.8 9.7 8.8 8.75C8.8 7.66 9.81 6.9 11.5 6.9C13.28 6.9 13.94 7.75 14 9H16.21C16.14 7.28 15.09 5.7 13 5.19V3H10V5.16C8.06 5.58 6.5 6.84 6.5 8.77C6.5 10.65 8.2 11.9 11.2 12.58C13.7 13.11 14.2 13.9 14.2 14.9C14.2 16.08 13.31 16.9 11.5 16.9C9.44 16.9 8.63 16 8.5 14.67H6.32C6.44 16.66 7.9 18.16 10 18.58V21H13V18.84C14.95 18.5 16.5 17.35 16.5 15.3C16.5 13.07 14.57 11.77 11.8 10.9Z" fill="currentColor"/>
      </svg>
      <!-- Chart Icon -->
      <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3.5 18.49L6 15.99L9.5 19.49L16.5 12.49L20 15.99V19.49H16.5L9.5 12.49L6 15.99L3.5 13.49V18.49ZM3.5 3.49V7.99L6 5.49L9.5 8.99L16.5 1.99L20 5.49V1.99H3.5V3.49Z" fill="currentColor"/>
      </svg>
      <!-- Box Icon (default) -->
      <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 7H4C3.45 7 3 7.45 3 8V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V8C21 7.45 20.55 7 20 7ZM19 19H5V9H19V19Z" fill="currentColor"/>
        <path d="M7 11H17V13H7V11ZM7 15H14V17H7V15Z" fill="currentColor"/>
        <path d="M9 3L7.5 5.5H16.5L15 3H9Z" fill="currentColor"/>
      </svg>
    </ng-container>
  </div>
  <div class="card-content">
    <div class="card-value">{{ cardData.value }}</div>
    <div class="card-title">{{ cardData.title }}</div>
  </div>
</div>
