<div class="quick-actions-section">
  <div class="section-header">
    <h2 class="section-title">Acciones Rápidas</h2>
  </div>
  <div class="actions-grid">
    <button 
      *ngFor="let action of actions" 
      class="action-button"
      (click)="executeAction(action.action)">
      <span class="action-icon">
        <ng-container [ngSwitch]="action.icon">
          <!-- Plus Icon -->
          <svg *ngSwitchCase="'plus'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 13H13V19H11V13H5V11H11V5H13V11H19V13Z" fill="currentColor"/>
          </svg>
          <!-- Input Icon -->
          <svg *ngSwitchCase="'input'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 20V4H19V10H21V4C21 2.9 20.1 2 19 2H5C3.9 2 3 2.9 3 4V20C3 21.1 3.9 22 5 22H11V20H5ZM17 13H13V17H17V13ZM19 15H15V19H19V15Z" fill="currentColor"/>
          </svg>
          <!-- Output Icon -->
          <svg *ngSwitchCase="'output'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 11H13V5H11V11H5V13H11V19H13V13H19V11ZM19 20V14H21V20C21 21.1 20.1 22 19 22H5C3.9 22 3 21.1 3 20V14H5V20H19Z" fill="currentColor"/>
          </svg>
          <!-- Adjust Icon -->
          <svg *ngSwitchCase="'adjust'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="currentColor"/>
          </svg>
          <!-- Reports Icon -->
          <svg *ngSwitchDefault viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19Z" fill="currentColor"/>
            <path d="M7 10H9V17H7V10ZM11 7H13V17H11V7ZM15 13H17V17H15V13Z" fill="currentColor"/>
          </svg>
        </ng-container>
      </span>
      <span class="action-label">{{ action.label }}</span>
    </button>
  </div>
</div>
