<div class="register-container">
  <div class="register-background">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
  </div>
  
  <div class="register-card">
    <div class="register-header">
      <div class="logo-container">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 7H4C3.45 7 3 7.45 3 8V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V8C21 7.45 20.55 7 20 7ZM19 19H5V9H19V19Z" fill="white"/>
            <path d="M7 11H17V13H7V11ZM7 15H14V17H7V15Z" fill="white"/>
            <path d="M9 3L7.5 5.5H16.5L15 3H9Z" fill="white"/>
          </svg>
        </div>
        <h1 class="register-title">Inventory</h1>
      </div>
      <p class="register-subtitle">Crea tu cuenta</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <label for="nombre" class="form-label">Nombre completo</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 14.67 14 12 14Z" fill="currentColor"/>
            </svg>
          </span>
          <input 
            id="nombre"
            type="text" 
            formControlName="nombre" 
            class="form-input"
            placeholder="Tu nombre completo"
            [class.error]="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched">
        </div>
        <span *ngIf="registerForm.get('nombre')?.invalid && registerForm.get('nombre')?.touched" class="error-message">
          Mínimo 3 caracteres
        </span>
      </div>

      <div class="form-group">
        <label for="correo" class="form-label">Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4ZM20 8L12 13L4 8V6L12 11L20 6V8Z" fill="currentColor"/>
            </svg>
          </span>
          <input 
            id="correo"
            type="email" 
            formControlName="correo" 
            class="form-input"
            placeholder="tu@email.com"
            [class.error]="registerForm.get('correo')?.invalid && registerForm.get('correo')?.touched">
        </div>
        <span *ngIf="registerForm.get('correo')?.invalid && registerForm.get('correo')?.touched" class="error-message">
          Email inválido
        </span>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 8H17V6C17 3.24 14.76 1 12 1S7 3.24 7 6V8H6C4.9 8 4 8.9 4 10V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V10C20 8.9 19.1 8 18 8ZM12 3C13.66 3 15 4.34 15 6V8H9V6C9 4.34 10.34 3 12 3ZM18 20H6V10H18V20Z" fill="currentColor"/>
            </svg>
          </span>
          <input 
            id="password"
            type="password" 
            formControlName="password" 
            class="form-input"
            placeholder="••••••••"
            [class.error]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
        </div>
        <span *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched" class="error-message">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M18 8H17V6C17 3.24 14.76 1 12 1S7 3.24 7 6V8H6C4.9 8 4 8.9 4 10V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V10C20 8.9 19.1 8 18 8ZM12 3C13.66 3 15 4.34 15 6V8H9V6C9 4.34 10.34 3 12 3ZM18 20H6V10H18V20Z" fill="currentColor"/>
            </svg>
          </span>
          <input 
            id="confirmPassword"
            type="password" 
            formControlName="confirmPassword" 
            class="form-input"
            placeholder="••••••••"
            [class.error]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
        </div>
        <span *ngIf="registerForm.get('confirmPassword')?.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="error-message">
          Las contraseñas no coinciden
        </span>
        <span *ngIf="registerForm.get('confirmPassword')?.invalid && !registerForm.get('confirmPassword')?.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched" class="error-message">
          Confirma tu contraseña
        </span>
      </div>

      <div *ngIf="error" class="error-alert">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM13 17H11V15H13V17ZM13 13H11V7H13V13Z" fill="currentColor"/>
        </svg>
        {{ error }}
      </div>

      <div *ngIf="success" class="success-alert">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z" fill="currentColor"/>
        </svg>
        ¡Registro exitoso! Redirigiendo al login...
      </div>

      <button 
        type="submit" 
        class="register-button"
        [disabled]="loading || registerForm.invalid">
        <span *ngIf="!loading">Crear cuenta</span>
        <span *ngIf="loading" class="loading-spinner">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" opacity="0.25"/>
            <path d="M12 2C6.48 2 2 6.48 2 12" stroke="currentColor" stroke-width="4" fill="none" stroke-linecap="round"/>
          </svg>
          Registrando...
        </span>
      </button>

      <div class="register-footer">
        <p>¿Ya tienes cuenta? <a routerLink="/login" class="login-link">Inicia sesión</a></p>
      </div>
    </form>
  </div>
</div>
