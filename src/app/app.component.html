<div class="app-container" *ngIf="!isLoginPage && authService.isAuthenticated()">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 7H4C3.45 7 3 7.45 3 8V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V8C21 7.45 20.55 7 20 7ZM19 19H5V9H19V19Z" fill="white"/>
            <path d="M7 11H17V13H7V11ZM7 15H14V17H7V15Z" fill="white"/>
            <path d="M9 3L7.5 5.5H16.5L15 3H9Z" fill="white"/>
          </svg>
        </div>
        <div class="logo-text">
          <div class="logo-title">Inventory</div>
          <div class="logo-subtitle">Sistema POS</div>
        </div>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <a class="nav-item active" routerLink="/dashboard" routerLinkActive="active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 13H11V3H3V13ZM3 21H11V15H3V21ZM13 21H21V11H13V21ZM13 3V9H21V3H13Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Dashboard</span>
      </a>
      <a class="nav-item" routerLink="/productos" routerLinkActive="active">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V5H19V19Z" fill="currentColor"/>
            <path d="M7 7H17V9H7V7ZM7 11H17V13H7V11ZM7 15H14V17H7V15Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Productos</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.89 22 5.99 22H18C19.1 22 20 21.1 20 20V8L14 2ZM18 20H6V4H13V9H18V20Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Pedidos</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 18C8.1 18 9 18.9 9 20C9 21.1 8.1 22 7 22C5.9 22 5 21.1 5 20C5 18.9 5.9 18 7 18ZM1 2V4H3L6.6 11.59L5.25 14.04C5.09 14.32 5 14.65 5 15C5 16.1 5.9 17 7 17H19V15H7.42C7.28 15 7.17 14.89 7.17 14.75L7.2 14.63L8.1 13H15.55C16.3 13 16.96 12.59 17.3 11.97L20.88 5.5C20.96 5.34 21 5.17 21 5C21 4.45 20.55 4 20 4H5.21L4.27 2H1ZM17 18C18.1 18 19 18.9 19 20C19 21.1 18.1 22 17 22C15.9 22 15 21.1 15 20C15 18.9 15.9 18 17 18Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Ventas</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 15.67 14 12 14Z" fill="currentColor"/>
            <path d="M18 10C19.1 10 20 9.1 20 8C20 6.9 19.1 6 18 6C16.9 6 16 6.9 16 8C16 9.1 16.9 10 18 10ZM18 12C16.67 12 14 12.67 14 14V16H22V14C22 12.67 19.33 12 18 12Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Usuarios</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 9.2H3V20.8C3 21.46 3.54 22 4.2 22H15.8V20H5V9.2ZM19 3H8.2C7.54 3 7 3.54 7 4.2V14.8C7 15.46 7.54 16 8.2 16H19.8C20.46 16 21 15.46 21 14.8V4.2C21 3.54 20.46 3 19.8 3H19ZM9 13H19V5H9V13Z" fill="currentColor"/>
            <path d="M11 7H17V9H11V7ZM11 11H17V13H11V11Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Reportes</span>
      </a>
      <a class="nav-item" href="#">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19.14 12.94C19.54 12.54 19.54 11.91 19.14 11.51L13.35 5.72C12.95 5.32 12.32 5.32 11.92 5.72L6.13 11.51C5.73 11.91 5.73 12.54 6.13 12.94C6.53 13.34 7.16 13.34 7.56 12.94L11.64 8.86V18.92C11.64 19.47 12.09 19.92 12.64 19.92C13.19 19.92 13.64 19.47 13.64 18.92V8.86L17.72 12.94C17.92 13.14 18.17 13.24 18.43 13.24C18.69 13.24 18.94 13.14 19.14 12.94Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Configuración</span>
      </a>
      <a class="nav-item" (click)="authService.logout()" style="cursor: pointer;">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 7L15.59 8.41L18.17 11H8V13H18.17L15.59 15.59L17 17L22 12L17 7ZM4 5H12V3H4C2.9 3 2 3.9 2 5V19C2 20.1 2.9 21 4 21H12V19H4V5Z" fill="currentColor"/>
          </svg>
        </span>
        <span class="nav-text">Cerrar Sesión</span>
      </a>
    </nav>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <div class="header-left">
        <button class="menu-toggle">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 18H21V16H3V18ZM3 13H21V11H3V13ZM3 6V8H21V6H3Z" fill="currentColor"/>
          </svg>
        </button>
        <div class="search-bar">
          <span class="search-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15.5 14H14.71L14.43 13.73C15.41 12.59 16 11.11 16 9.5C16 5.91 13.09 3 9.5 3C5.91 3 3 5.91 3 9.5C3 13.09 5.91 16 9.5 16C11.11 16 12.59 15.41 13.73 14.43L14 14.71V15.5L19 20.49L20.49 19L15.5 14ZM9.5 14C7.01 14 5 11.99 5 9.5C5 7.01 7.01 5 9.5 5C11.99 5 14 7.01 14 9.5C14 11.99 11.99 14 9.5 14Z" fill="currentColor"/>
            </svg>
          </span>
          <input type="text" placeholder="Buscar..." />
        </div>
      </div>
      <div class="header-right">
        <div class="user-info-container" (click)="toggleUserMenu()">
          <div class="user-info">
            <div class="user-avatar">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 15.67 14 12 14Z" fill="white"/>
              </svg>
            </div>
            <div class="user-details">
              <div class="user-name">{{ authService.getCurrentUser()?.nombre || 'Usuario' }}</div>
              <div class="user-role">{{ authService.getCurrentUser()?.perfiles?.[0]?.nombre || 'Administrador' }}</div>
            </div>
            <span class="dropdown-arrow" [class.open]="isUserMenuOpen">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 10L12 15L17 10H7Z" fill="currentColor"/>
              </svg>
            </span>
          </div>

          <div class="user-menu" [class.open]="isUserMenuOpen" (click)="$event.stopPropagation()">
            <a class="menu-item" (click)="goToProfile()">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 12C14.21 12 16 10.21 16 8C16 5.79 14.21 4 12 4C9.79 4 8 5.79 8 8C8 10.21 9.79 12 12 12ZM12 14C9.33 14 4 15.34 4 18V20H20V18C20 15.34 15.67 14 12 14Z" fill="currentColor"/>
                </svg>
              </span>
              <span class="menu-text">Perfil</span>
            </a>
            <div class="menu-divider"></div>
            <a class="menu-item logout-item" (click)="logout()">
              <span class="menu-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M17 7L15.59 8.41L18.17 11H8V13H18.17L15.59 15.59L17 17L22 12L17 7ZM4 5H12V3H4C2.9 3 2 3.9 2 5V19C2 20.1 2.9 21 4 21H12V19H4V5Z" fill="currentColor"/>
                </svg>
              </span>
              <span class="menu-text">Cerrar sesión</span>
            </a>
          </div>
        </div>
      </div>
    </header>

    <router-outlet></router-outlet>
  </div>
</div>

<router-outlet *ngIf="isLoginPage || !authService.isAuthenticated()"></router-outlet>
